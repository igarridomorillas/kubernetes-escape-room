apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: escape-level-04
  labels:
    app: payment
    component: backend
    level: "04"
spec:
  type: ClusterIP
  selector:
    app: payment
    component: backend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: http-8080
      port: 8080
      targetPort: http
      protocol: TCP
