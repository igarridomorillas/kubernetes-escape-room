apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: escape-level-04
  labels:
    app: gateway
    component: frontend
    level: "04"
spec:
  type: ClusterIP
  selector:
    app: gateway
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: http-8080
      port: 8080
      targetPort: http
      protocol: TCP
