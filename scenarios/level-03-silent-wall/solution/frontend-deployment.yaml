apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: escape-level-03
  labels:
    app: frontend
    component: frontend
    level: "03"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      component: frontend
  template:
    metadata:
      labels:
        app: frontend
        component: frontend
        role: web-frontend
        level: "03"
    spec:
      containers:
        - name: frontend
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
