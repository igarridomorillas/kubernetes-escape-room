apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: escape-level-03
  labels:
    app: backend
    component: backend
    level: "03"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      component: backend
  template:
    metadata:
      labels:
        app: backend
        component: backend
        level: "03"
    spec:
      containers:
        - name: backend
          image: nginx:1.27-alpine
          ports:
            - containerPort: 9000
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: backend-nginx-config
