apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: escape-level-03
  labels:
    app: frontend
    component: frontend
    level: "03"
spec:
  type: ClusterIP
  selector:
    app: frontend
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
