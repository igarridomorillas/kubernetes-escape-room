apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: escape-level-01
  labels:
    app: payment-gateway
    component: backend
    level: "01"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-gateway
      component: backend
  template:
    metadata:
      labels:
        app: payment-gateway
        component: backend
        level: "01"
    spec:
      containers:
        - name: payment-gateway
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
