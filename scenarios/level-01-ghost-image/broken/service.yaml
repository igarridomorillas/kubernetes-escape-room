apiVersion: v1
kind: Service
metadata:
  name: payment-gateway
  namespace: escape-level-01
  labels:
    app: payment-gateway
    component: backend
    level: "01"
spec:
  type: ClusterIP
  selector:
    app: payment-gateway
    component: backend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
